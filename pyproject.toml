[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-proxy"
version = "0.1.0"
description = "Relay allowlisted HTTP requests through a browser session"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Browser Proxy contributors" }]
dependencies = []

[project.scripts]
browser-proxy = "browser_proxy.cli:main"
browser-proxy-host = "browser_proxy.native_host:main"
browser-proxy-install = "browser_proxy.install:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
